name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component rustfmt --component clippy
      - name: Format check
        run: cargo +stable-x86_64-pc-windows-msvc fmt --all -- --check
      - name: Clippy
        run: cargo +stable-x86_64-pc-windows-msvc clippy --locked --all-targets
      - name: Test
        run: cargo +stable-x86_64-pc-windows-msvc test --locked
      - name: Release build
        run: cargo +stable-x86_64-pc-windows-msvc build --locked --release
