[package]
name = "zju-net-assistant"
version = "0.1.5"
edition = "2021"
license = "MIT"
description = "Lightweight Windows tray client for ZJU Srun portal authentication"

[dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemServices", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_Security", "Win32_Security_Credentials", "Win32_NetworkManagement_Dns", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Power"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex-lite = "0.1"
socket2 = { version = "0.5", features = ["all"] }
native-tls = "0.2"
schannel = "=0.1.27"
url = "2"
md-5 = "0.10"
sha1 = "0.10"
hmac = "0.12"
zeroize = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
